spring:
  application:
    name: guardian-api

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8081

logging:
  level:
    com.guardianapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

firebase:
  enabled: true
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:secrets/manto-app-ade75-firebase-adminsdk-fbsvc-7118566358.json}

google:
  safe-browsing:
    enabled: ${GOOGLE_SAFE_BROWSING_ENABLED:true}
    api-key: ${GOOGLE_SAFE_BROWSING_API_KEY:AIzaSyBtBXvklHmPfUTsTDJt88Vq1HKn_QGZreo}
    base-url: ${GOOGLE_SAFE_BROWSING_BASE_URL:https://safebrowsing.googleapis.com}
    client-id: ${GOOGLE_SAFE_BROWSING_CLIENT_ID:guardian-api}
    client-version: ${GOOGLE_SAFE_BROWSING_CLIENT_VERSION:1.0.0}
    threat-types:
      - SOCIAL_ENGINEERING
      - MALWARE
      - UNWANTED_SOFTWARE
      - POTENTIALLY_HARMFUL_APPLICATION
    platform-types:
      - ANY_PLATFORM
    threat-entry-types:
      - URL
  drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:false}
    service-account-path: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_PATH:secrets/google-drive-service-account.json}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:root}
