spring:
  application:
    name: guardian-api

  datasource:
    url: jdbc:postgresql://localhost:5432/guardian_db
    username: guardian_user
    password: guardian_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: 8080

logging:
  level:
    com.guardianapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

firebase:
  enabled: true
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:D:/Java/guardian-api/secrets/manto-app-ade75-firebase-adminsdk-fbsvc-7118566358.json}
